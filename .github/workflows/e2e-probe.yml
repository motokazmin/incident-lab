# Проба: выдерживает ли раннер GitHub наши виртуалки. Только по кнопке.
# Ответ — есть ли /dev/kvm, проходит ли контракт каркаса и сколько занимает каждый шаг.
name: e2e-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Машина
        run: |
          nproc; free -h; df -h / ; uname -r
          grep -cE 'vmx|svm' /proc/cpuinfo || echo "нет флагов виртуализации"
          ls -l /dev/kvm || echo "нет /dev/kvm"

      # На раннерах /dev/kvm принадлежит root: открываем его пользователю runner.
      - name: Доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Firecracker и ядро
        run: scripts/setup-firecracker.sh

      - name: Быстрые тесты
        run: go test ./...

      - name: Образы контракта
        run: scripts/build-images.sh pool-exhausted keeps-restarting

      - name: e2e контракт
        run: scripts/e2e.sh contract

      - name: Логи e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .data/e2e/
          if-no-files-found: ignore
