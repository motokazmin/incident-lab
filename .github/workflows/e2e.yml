# e2e на настоящих виртуалках, см. docs/adr/0011-e2e-in-ci.md.
# Пуш в любую ветку: быстрые тесты и то, что требует дифф (в main — от прошлого пуша, в ветке —
# от main), все случаи изменённых сюжетов. Раз в неделю и по кнопке: всё, по задаче на сюжет;
# кнопка с полем target гоняет один сюжет или контракт на выбранной ветке.
name: e2e

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "id сюжета или contract; пусто — всё"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  # Новый пуш в ветку отменяет прогон прежнего; в main каждый пуш досчитывается.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Быстрые тесты
        run: go test ./...
      - name: e2e по диффу пуша
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            base=$BEFORE
            git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          else
            base=$(git merge-base origin/main HEAD)
          fi
          scripts/e2e.sh changed --full "$base"
      - name: Логи e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-changed
          path: .data/e2e/
          if-no-files-found: ignore

  list:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          TARGET: ${{ inputs.target }}
        run: |
          all=$( { echo contract; cd scenarios && ls -d */ | tr -d /; } )
          if [ -n "$TARGET" ]; then
            grep -qxF -- "$TARGET" <<<"$all" || { echo "нет такого сюжета: $TARGET; есть: $(echo $all)"; exit 1; }
            all=$TARGET
          fi
          echo "ids=$(jq -Rnc '[inputs]' <<<"$all")" >> "$GITHUB_OUTPUT"

  all:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: e2e ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = contract ]; then scripts/e2e.sh contract; else scripts/e2e.sh scenario "$TARGET"; fi
      - name: Логи e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.target }}
          path: .data/e2e/
          if-no-files-found: ignore
