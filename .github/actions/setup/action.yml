name: setup
description: KVM для пользователя раннера, Go, Firecracker и гостевое ядро.
runs:
  using: composite
  steps:
    # На раннерах /dev/kvm принадлежит root: открываем его пользователю runner.
    - name: Доступ к KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        test -w /dev/kvm
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Firecracker и ядро
      shell: bash
      run: scripts/setup-firecracker.sh
